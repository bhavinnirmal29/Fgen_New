# =============================================================================
# Production stack -- AWS EC2 (t3.micro, 1 GB RAM, x86_64)
#
#   cd /opt/fgen && docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# CI pushes the web image to ghcr.io; this file only ever pulls it.
# Data lives in named volumes (pg_data, media, caddy_data) and survives deploys.
# =============================================================================

name: fgen

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- reverse proxy
  caddy:
    image: caddy:2.8-alpine
    container_name: fgen-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks: [edge, internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 128M}

  # ---------------------------------------------------------------- django
  web:
    image: ${REGISTRY}/web:${IMAGE_TAG:-latest}
    container_name: fgen-web
    restart: unless-stopped
    expose: ["8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 512M}

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: fgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 256M}

networks:
  edge:
  internal:

volumes:
  pg_data:
  media:
  caddy_data:
  caddy_config:
