name: CI

# Fast feedback on pull requests and non-deploy branches. Never deploys.
# (Pushes to the deploy branch run the same checks inside deploy.yml.)

on:
  pull_request:
  push:
    branches-ignore: [fix-storages-import]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fgen_test
          POSTGRES_USER: fgen
          POSTGRES_PASSWORD: fgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SIMPLE_STATIC: "True"
      DATABASE_URL: postgres://fgen:fgen@localhost:5432/fgen_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --noinput -v 2

  docker:
    name: Image builds & compose validates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate production compose file
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.prod.yml config -q
          echo "compose config OK"
