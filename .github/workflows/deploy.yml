name: Deploy to AWS EC2

# Every push to fix-storages-import: run the CI checks, build the web image,
# push it to GitHub Container Registry, then SSH into the EC2 host and roll
# the stack forward.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST         Elastic IP of the EC2 instance (40.177.208.177)
#   EC2_USER         ssh user (ubuntu)
#   EC2_SSH_KEY      private key, full PEM including BEGIN/END lines
#   ADMIN_PASSWORD   optional; Django admin password, re-applied on every deploy
#   ADMIN_USERNAME   optional, defaults to admin
# App secrets, written into /opt/fgen/.env on every deploy when set:
#   EMAIL_HOST_PASSWORD, STRIPE_PUBLIC_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# GITHUB_TOKEN is provided automatically and is what pushes to / pulls from ghcr.io.
#
# The host is x86_64 (t3.micro), so the image is built natively for linux/amd64.

on:
  push:
    branches: [fix-storages-import]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  APP_DIR: /opt/fgen
  SITE_HOST: fgen.ca

jobs:
  # ---------------------------------------------------------------- 1. checks
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------- 2. build
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tag and registry path
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # ghcr.io paths must be lowercase.
          echo "registry=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.registry }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------- 3. deploy
  deploy:
    name: Roll out on EC2
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://fgen.ca

    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/docker-compose.prod.yml,infra/caddy/Caddyfile,infra/.env.example"
          target: ${{ env.APP_DIR }}
          strip_components: 1
          overwrite: true

      - name: Pull new image and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: ${{ needs.build.outputs.registry }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          STRIPE_PUBLIC_KEY_TEST: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY,ADMIN_USERNAME,ADMIN_PASSWORD,EMAIL_HOST_PASSWORD,STRIPE_PUBLIC_KEY_TEST,STRIPE_SECRET_KEY_TEST,STRIPE_WEBHOOK_SECRET_TEST
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            C="docker compose --env-file .env -f docker-compose.prod.yml"

            # .env lives only on the host and is never in git.
            if [ ! -f .env ]; then
              echo "::error::${{ env.APP_DIR }}/.env is missing. Create it from .env.example first."
              exit 1
            fi

            # Upsert KEY=VALUE into .env. Single quotes keep compose from expanding
            # '$' inside secrets; a value containing a single quote is written raw.
            set_env() {
              local v="$2"
              case "$v" in *"'"*) ;; *) v="'$v'" ;; esac
              { grep -v "^$1=" .env || true; printf '%s=%s\n' "$1" "$v"; } > .env.tmp
              mv .env.tmp .env
            }

            # Pin this rollout to the freshly built image.
            set_env IMAGE_TAG "$IMAGE_TAG"
            set_env REGISTRY "$REGISTRY"

            # App secrets managed in GitHub; only overwrite when the secret is set.
            for k in EMAIL_HOST_PASSWORD STRIPE_PUBLIC_KEY_TEST STRIPE_SECRET_KEY_TEST STRIPE_WEBHOOK_SECRET_TEST; do
              if [ -n "${!k:-}" ]; then set_env "$k" "${!k}"; fi
            done
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Back up the database before migrations run; keep the last 10.
            mkdir -p backups
            if [ -n "$($C ps -q postgres 2>/dev/null)" ]; then
              $C exec -T postgres pg_dump -U "$(grep '^POSTGRES_USER=' .env | cut -d= -f2)" \
                -d "$(grep '^POSTGRES_DB=' .env | cut -d= -f2)" \
                > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql" \
                || echo "::warning::pre-deploy backup failed"
              ls -t backups/pre-deploy-*.sql 2>/dev/null | tail -n +11 | xargs -r rm --
            fi

            $C pull
            $C up -d --remove-orphans
            docker image prune -af --filter "until=168h"

            echo "waiting for web to become healthy..."
            for i in $(seq 1 40); do
              if $C exec -T web curl -fsS -H "Host: localhost" http://127.0.0.1:8000/healthz/ >/dev/null 2>&1; then
                echo "web healthy after ${i} attempts"
                if [ -n "${ADMIN_PASSWORD:-}" ]; then
                  $C exec -T -e ADMIN_USERNAME -e ADMIN_PASSWORD web python manage.py shell -c "
            import os
            from django.contrib.auth import get_user_model
            from django.utils import timezone
            U = get_user_model()
            u, created = U.objects.get_or_create(username=os.environ['ADMIN_USERNAME'], defaults={'last_login': timezone.now()})
            u.is_staff = u.is_superuser = u.is_active = True
            u.set_password(os.environ['ADMIN_PASSWORD'])
            u.save()
            print('admin user', 'created' if created else 'updated')
            "
                fi
                exit 0
              fi
              sleep 5
            done
            echo "::error::web did not become healthy"
            $C logs --tail=100 web
            exit 1

      - name: Public smoke test
        run: |
          ip=$(dig +short "${SITE_HOST}" A | tail -1)
          if [ "$ip" != "${{ secrets.EC2_HOST }}" ]; then
            echo "::notice::${SITE_HOST} resolves to '${ip}', not this host yet - skipping public check."
            exit 0
          fi
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${SITE_HOST}/" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::https://${SITE_HOST} did not return 200"
          exit 1
